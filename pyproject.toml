[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rosbag-doctor"
version = "0.1.0"
description = "Check ROS 2 bags for timing gaps, bad rates, timestamp problems, coverage loss, and sensor-sync issues."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sylvester Kaczmarek"}]
keywords = ["ros2", "rosbag2", "robotics", "mcap", "data-quality", "sensor-fusion"]
dependencies = [
  "mcap>=1.4,<2",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
rosbag-doctor = "rosbag_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/sylvesterkaczmarek/rosbag-doctor"
Repository = "https://github.com/sylvesterkaczmarek/rosbag-doctor"
Issues = "https://github.com/sylvesterkaczmarek/rosbag-doctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
