[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rosbag-doctor"
version = "0.1.1"
description = "CLI and Python library for checking ROS 2 bags for timing, coverage, timestamp, rate, and sensor-sync problems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sylvester Kaczmarek"}]
keywords = ["ros2", "rosbag2", "robotics", "mcap", "data-quality", "sensor-fusion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcap>=1.4,<2",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "build>=1.2",
]

[project.scripts]
rosbag-doctor = "rosbag_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/sylvesterkaczmarek/rosbag-doctor"
Repository = "https://github.com/sylvesterkaczmarek/rosbag-doctor"
Issues = "https://github.com/sylvesterkaczmarek/rosbag-doctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
