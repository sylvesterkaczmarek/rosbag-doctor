name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke test
        run: make smoke

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
      - name: Installed-wheel smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python examples/make_demo_bag.py "$tmpdir/demo-bag" >/dev/null
          cd "$tmpdir"
          rosbag-doctor --version
          set +e
          rosbag-doctor demo-bag --json demo-report.json
          code=$?
          set -e
          test "$code" -eq 1
          test -s demo-report.json
          python - <<'PY'
          import rosbag_doctor
          from rosbag_doctor import inspect_bag

          assert rosbag_doctor.__version__ == "0.1.1"
          assert callable(inspect_bag)
          PY

  cross-platform:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: CLI and SQLite smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-demo-bag .ci-demo-report.json
          python examples/make_demo_bag.py .ci-demo-bag >/dev/null
          rosbag-doctor --version
          set +e
          rosbag-doctor .ci-demo-bag --json .ci-demo-report.json
          code=$?
          set -e
          test "$code" -eq 1
          test -s .ci-demo-report.json
