name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Exercise minimum runtime dependencies
        if: matrix.python-version == '3.10'
        run: python -m pip install 'numpy==1.24.0' 'PyYAML==6.0' 'mcap==1.4.0' 'rich==13.7.0'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke test
        run: make smoke

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
      - name: Test source archive against installed wheel
        shell: bash
        run: |
          python -m pip install pytest
          python - <<'PYTEST'
          import subprocess
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as temporary:
              with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
                  archive.extractall(temporary, filter="data")
              source = next(Path(temporary).iterdir())
              for required in ("tests/conftest.py", "examples/make_demo_bag.py", "docs/checks.md"):
                  assert (source / required).is_file(), required
              subprocess.run(
                  [sys.executable, "-m", "pytest", str(source / "tests"), "-q"],
                  cwd=temporary, check=True,
              )
          PYTEST
      - name: Installed-wheel smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python examples/make_demo_bag.py "$tmpdir/demo-bag" >/dev/null
          cd "$tmpdir"
          rosbag-doctor --version
          python - <<'PY'
          from pathlib import Path
          import subprocess

          import rosbag_doctor
          from rosbag_doctor import inspect_bag

          report = Path("demo-report.json")
          result = subprocess.run(
              ["rosbag-doctor", "demo-bag", "--json", str(report)],
              check=False,
          )
          assert result.returncode in {0, 1}
          assert report.is_file() and report.stat().st_size > 0
          assert rosbag_doctor.__version__ == "0.1.1"
          assert callable(inspect_bag)
          PY

  cross-platform:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: CLI and SQLite smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-demo-bag .ci-demo-report.json
          python examples/make_demo_bag.py .ci-demo-bag >/dev/null
          rosbag-doctor --version
          python - <<'PY'
          from pathlib import Path
          import subprocess

          report = Path(".ci-demo-report.json")
          result = subprocess.run(
              ["rosbag-doctor", ".ci-demo-bag", "--json", str(report)],
              check=False,
          )
          assert result.returncode in {0, 1}
          assert report.is_file() and report.stat().st_size > 0
          PY
